name: Finalize v0.5.0 release

on:
  push:
    branches:
      - "finalize/v0.5.0"

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Download the exact successful v0.5.0 artifact set
        uses: actions/download-artifact@v8
        with:
          name: python-package
          path: artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35503407103
      - name: Verify recorded checksums
        run: |
          cd artifact
          sha256sum -c SHA256SUMS
      - name: Create immutable v0.5.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.5.0" \
            artifact/dist/* artifact/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "b0541b8fe631a6bd7a44e52e45696e759061074f" \
            --generate-notes \
            --title "v0.5.0"
