[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stac-scout"
version = "0.3.0"
description = "Evidence-backed dataset selection and verification for STAC catalogs."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "GeoGeekLab" }]
keywords = ["stac", "geospatial", "earth-observation", "gis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyproj>=3.6,<4",
  "pystac-client>=0.8,<1",
  "rich>=13.7,<15",
  "shapely>=2.0,<3",
  "typer>=0.12,<1",
]

[project.urls]
Repository = "https://github.com/GeoGeekLab/stac-scout"
Issues = "https://github.com/GeoGeekLab/stac-scout/issues"

[project.optional-dependencies]
planetary-computer = ["planetary-computer>=1.0.0"]
raster = [
  "odc-stac>=0.4,<1",
  "rasterio>=1.4,<2",
  "xarray>=2024.7",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-shapely",
]

[project.scripts]
stac-scout = "stac_scout.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stac_scout"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["stac_scout"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
